name: 出包并发布

# 二开之前：所有 Release 附件都是作者在电脑上跑脚本、手动上传的。
# 1.1.4 和 1.1.5 就是这么出的事 —— bumpVersion.ps1 静默跳过了 csproj，
# 编译出来的 exe 版本号一直是 1.1.3，包却照发不误。
#
# 现在改成 push tag 就自动出包：
#   · 版本号从 tag 推（v1.1.6 → 1.1.6），不会再出现「version.json 和 exe 对不上」
#   · mkrelease.ps1 结尾会校验包内 exe 的文件版本，对不上就 exit 1，传不上去
#   · 环境干净，不会有本地调试残留混进包里
#
# 用法：
#   git tag v1.1.7 && git push origin v1.1.7
#
# 能跑通的关键在于 OMniX.WinUI.csproj 里是 <WindowsPackageType>None</WindowsPackageType>
# —— 不打 MSIX，不需要证书和 MSIX 工具链，纯 dotnet publish 就能出包。
# 这点以后别改，改成 MSIX 的话 CI 立刻就麻烦了。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要出的版本号，例如 1.1.7。留空就用 version.json 里的'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 定版本号
        id: ver
        shell: pwsh
        run: |
          # 二开：这里刻意不碰 bumpVersion.ps1。
          # 之前在 CI 里 nested 调用 pwsh -File bumpVersion.ps1，1 秒就失败，
          # 拿不到日志也说不清是编码还是执行策略的问题。改版本号就几行正则，
          # 干脆内联，少一个失败点，也少一层猜。
          $v = ''

          $given = '${{ github.event.inputs.version }}'
          Write-Output "手动输入的版本号: [$given]"

          if ($given) {
              $v = $given
          }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
              # refs/tags/v1.1.6 -> 1.1.6，用 Substring 比正则直观
              $v = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          else {
              $v = (Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          }

          Write-Output "最终版本号: [$v]"

          if (-not $v) {
              throw "版本号是空的，tag 或 version.json 有问题"
          }

          # 注意编码：pwsh 的 -Encoding utf8 会带 BOM，GitHub 解析 GITHUB_OUTPUT
          # 时认不出第一行，后面几步拿到的就是空版本号。必须用 utf8NoBOM。
          "v=$v" | Out-File $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append

      - name: 把版本号刷进 version.json 和两个 csproj
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          Write-Output "拿到版本号: [$v]"

          if (-not $v) {
              throw "上一步没传出发布版本号"
          }

          # ---- version.json ----
          $jsonPath = Join-Path $PWD 'version.json'
          Write-Output "version.json 存在: $(Test-Path $jsonPath)"

          $json = Get-Content $jsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $json.version = $v
          $json.updated = (Get-Date).ToString('yyyy-MM-dd')
          $json | ConvertTo-Json -Depth 5 | Set-Content $jsonPath -Encoding utf8NoBOM

          # ---- csproj ----
          # 这两个才是真正决定编译产物的地方。1.1.4 / 1.1.5 就是这里没跟上，
          # 包里 exe 的文件版本一直停在 1.1.3.0。
          $targets = @(
              (Join-Path $PWD 'src\OMniX.WinUI\OMniX.WinUI.csproj'),
              (Join-Path $PWD 'src\OMniXLauncher\OMniXLauncher.csproj')
          )

          foreach ($file in $targets) {
              Write-Output "处理 $file   存在=$(Test-Path $file)"

              if (-not (Test-Path $file)) {
                  throw "找不到 $file"
              }

              $content = Get-Content $file -Raw -Encoding UTF8
              $content = $content -replace '<VersionPrefix>[^<]*</VersionPrefix>', "<VersionPrefix>$v</VersionPrefix>"
              $content = $content -replace '(<Version>)[^<]*(</Version>)', "`$1$v`$2"
              Set-Content $file -Value $content -Encoding utf8NoBOM -NoNewline

              Select-String -Path $file -Pattern 'VersionPrefix|<Version>' |
                  ForEach-Object { '    ' + $_.Line.Trim() }
          }

          # README 里的版本号不影响构建，顺手同步一下不折腾失败
          foreach ($md in @('README.md', 'README_EN.md', '使用说明.txt', '使用说明书.md')) {
              $p = Join-Path $PWD $md

              if (-not (Test-Path $p)) {
                  continue
              }

              try {
                  $c = Get-Content $p -Raw -Encoding UTF8
                  $c = $c -replace 'v\d+\.\d+\.\d+', "v$v"
                  Set-Content $p -Value $c -Encoding utf8NoBOM -NoNewline
              }
              catch {
                  Write-Output "  跳过 $md ：$($_.Exception.Message)"
              }
          }

      - name: 取回上一版的包（算增量补丁要用）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # mkrelease.ps1 是在 Releases\OMniX<版本>\OMniX\ 里找上一版做 diff 的。
          # CI 是全新 checkout，那个目录不存在，补丁会被整段跳过。
          # 这里先把上一个 Release 的整包拉下来解压到对应位置。
          $ver = "${{ steps.ver.outputs.v }}"
          $cur = "v$ver"
          Write-Output "当前版本: $cur"

          function Get-PrevPackage([string]$tag) {
              $v   = $tag.TrimStart('v')
              $dir = Join-Path 'Releases' "OMniX$v"

              if (Test-Path (Join-Path $dir 'OMniX')) {
                  Write-Output "已有 $tag，跳过下载"
                  return
              }

              New-Item -ItemType Directory -Force -Path $dir | Out-Null

              gh release download $tag --dir $dir --pattern 'OMniX*.zip' --clobber 2>$null

              $zip = Get-ChildItem $dir -Filter 'OMniX*.zip' -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -notlike '*-patch-*' } |
                     Select-Object -First 1

              if (-not $zip) {
                  Write-Output "拿不到 $tag 的整包，跳过"
                  return
              }

              Expand-Archive $zip.FullName -DestinationPath $dir -Force
              Write-Output "$tag 已就位：$($zip.Name)"
          }

          # 二开：mkrelease.ps1 现在按「固定基准版本」算补丁（$PatchBaseVersion），
          # 补丁里放的是「基准 → 新版本」的全部变化，基准及之后的版本都能直接装。
          # CI 是全新 checkout，本地那个 Releases\OMniX1.1.7\ 不存在，
          # 少了它会退回「上一版」逻辑，出的补丁又变成只对上一版有效 ——
          # 1.1.7 想一步升到 1.1.9 就又升不上来了。所以基准版也必须拉下来。
          #
          # 要改基准版本时，三处一起改：
          #   mkrelease.ps1 的 $PatchBaseVersion
          #   MainPageVM.cs 的 PatchBaseVersion
          #   下面这个 Get-PrevPackage 'v1.1.7'
          Get-PrevPackage 'v1.1.7'

          # 上一版：基准版缺失时的退路
          $prevTag = gh release list --limit 10 --json tagName -q '.[].tagName' |
                     Where-Object { $_ -and $_ -ne $cur } |
                     Select-Object -First 1

          if ($prevTag) {
              Get-PrevPackage $prevTag.Trim()
          }
          else {
              Write-Output "没有上一版，这次只出整包"
          }

      - name: 出包
        shell: pwsh
        run: |
          Write-Output "工作目录: $PWD"
          Write-Output "version.json: $((Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version)"
          pwsh -File mkrelease.ps1

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $tag = "v$ver"

          $zips = @(Get-ChildItem 'Releases' -Filter "OMniX$ver*.zip" | ForEach-Object { $_.FullName })

          if ($zips.Count -eq 0) {
              Write-Error "没找到要上传的包"
              exit 1
          }

          $zips | ForEach-Object { Write-Output "待上传: $_" }

          # tag 是 push 带过来的，Release 本体可能还没建
          $existing = gh release view $tag 2>$null

          if ($existing) {
              gh release upload $tag --clobber $zips
          }
          else {
              gh release create $tag --title "OMniX $ver" --generate-notes $zips
          }
